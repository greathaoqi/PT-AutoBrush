<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · PT-AutoBrush</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#f8fafc;padding:24px}.card{width:100%;max-width:420px;background:#182234;border:1px solid #334155;border-radius:20px;padding:36px;box-shadow:0 24px 80px #0004}.mark{color:#60a5fa;font-size:13px;letter-spacing:2px}h1{font-size:28px;margin:12px 0}p{color:#94a3b8;font-size:14px;line-height:1.6}label{display:block;margin:24px 0 8px;font-size:14px}input{display:block;width:100%;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#f8fafc;padding:12px;font:inherit}input:focus{outline:2px solid #60a5fa;outline-offset:2px}button{margin-top:24px;width:100%;border:0;border-radius:9px;background:#2563eb;color:white;padding:13px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#fca5a5;min-height:22px;margin-bottom:0}.foot{font-size:12px;margin-top:24px}
</style><script src="/login.js" defer></script></head><body><main class="card"><div class="mark">PT-AUTOBRUSH</div><h1>登录控制台</h1><p>管理站点、下载任务与自动化规则。</p><form id="loginForm"><label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" required maxlength="128" autofocus><label for="password">密码</label><input type="password" id="password" name="password" autocomplete="current-password" required maxlength="1024"><button id="submit" type="submit">登录</button><p id="error" role="alert" aria-live="polite"></p></form><p class="foot">登录有效期为 8 小时。共用设备使用后请退出登录。</p></main></body></html>
