name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Full Test Suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Test Suite
        run: python -m unittest discover -v

  deploy:
    name: Lightning Fast Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast Syntax & Privacy Guard
        run: |
          # 快速语法编译检查（0.1 秒完成）
          python3 -m py_compile server.py metrics.py account_status.py security.py security_admin.py

          # 防泄密门禁安全检查
          python3 -c "
          import os, re, sys
          forbidden = [
              r'fe314c4ffcef06f6900d8a702705ca88',
              r'c_secure_uid=MTg4Mzgy',
              r'userdetails\.php\?id=188382'
          ]
          for root, _, files in os.walk('.'):
              if '.git' in root or '.venv' in root: continue
              for f in files:
                  path = os.path.join(root, f)
                  try:
                      content = open(path, encoding='utf-8', errors='ignore').read()
                      for p in forbidden:
                          if re.search(p, content):
                              print(f'SECURITY LEAK: Pattern {p} found in {path}')
                              sys.exit(1)
                  except: pass
          print('Privacy check passed: OK')
          "

      - name: Direct Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${PORT}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 1. 本地极速归档需要更新的核心文件并直传服务器临时目录
          tar -czf /tmp/pt-update.tar.gz \
            server.py metrics.py account_status.py security.py security_admin.py \
            index.html app.js login.html login.js

          scp -i ~/.ssh/id_rsa -P "${PORT}" -o StrictHostKeyChecking=accept-new /tmp/pt-update.tar.gz "$USER@$HOST":/tmp/pt-update.tar.gz

          # 2. SSH 远程执行平滑部署
          ssh -i ~/.ssh/id_rsa -p "${PORT}" -o StrictHostKeyChecking=accept-new "$USER@$HOST" 'bash -s' << 'EOF'
            set -euo pipefail
            STAGE=$(mktemp -d /tmp/pt-stage.XXXXXX)
            cleanup() { rm -rf -- "$STAGE" /tmp/pt-update.tar.gz; }
            trap cleanup EXIT

            tar -xzf /tmp/pt-update.tar.gz -C "$STAGE"

            # 备份现有线上版本
            BACKUP="/opt/pt-brush/backups/$(date +%Y%m%d-%H%M%S)-ci-deploy"
            sudo mkdir -p "$BACKUP"
            sudo chmod 700 "$BACKUP"
            sudo cp -p /opt/pt-brush/*.py /opt/pt-brush/*.html /opt/pt-brush/*.js "$BACKUP/" 2>/dev/null || true

            # 安全替换文件
            for f in server.py metrics.py account_status.py security.py security_admin.py index.html app.js login.html login.js; do
              if [ -f "$STAGE/$f" ]; then
                sudo install -o root -g root -m 644 "$STAGE/$f" "/opt/pt-brush/$f"
              fi
            done

            # 重启服务并即时自检
            sudo systemctl restart pt-brush

            READY=0
            for _ in $(seq 1 10); do
              if curl --noproxy '*' -fsS --max-time 1 -o /dev/null http://127.0.0.1:12300/login; then
                READY=1
                break
              fi
              sleep 0.5
            done

            if [ "$READY" -ne 1 ]; then
              echo "[-] 服务启动异常，回滚..." >&2
              sudo cp -p "$BACKUP/"* /opt/pt-brush/
              sudo systemctl restart pt-brush
              exit 1
            fi

            echo "[+] 极速部署成功！"
          EOF
