limit_req_zone $binary_remote_addr zone=pt_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=pt_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pt_connections:10m;
log_format pt_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name pt.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/pt-acme; }
    location / { return 308 https://pt.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name pt.example.com;
    http2 on;
    server_tokens off;
    ssl_certificate /etc/nginx/ssl/pt.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pt.example.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:PT_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
    client_max_body_size 32m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn pt_connections 20;
    limit_req_status 429;
    access_log /var/log/nginx/pt.access.log pt_safe;
    error_log /var/log/nginx/pt.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host pt.example.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    location = /api/auth/login {
        client_max_body_size 4k;
        limit_req zone=pt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:12300;
    }
    location ~ ^/(?:data|backups|config|\.env|\.git)(?:[/.]|$) { return 404; }
    location / {
        limit_req zone=pt_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:12300;
    }
}
